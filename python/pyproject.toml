[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ferro"
version = "0.0.0"
description = "Python SDK for Ferro: script the Ferro app over Ferro Link (same API as MCP)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MPL-2.0" }
dependencies = []

[project.optional-dependencies]
numpy = ["numpy"]

[tool.setuptools]
packages = ["ferro"]

[tool.setuptools.package-data]
ferro = ["tools.json"]
