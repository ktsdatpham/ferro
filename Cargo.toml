[workspace]
resolver = "2"
members = [
    "crates/phac-core",
    "crates/phac-mcp",
    "crates/phac-ffi",
    "crates/phac-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ktsdatpham/phac"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
