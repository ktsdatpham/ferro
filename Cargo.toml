[workspace]
resolver = "2"
members = [
    "crates/ferro-core",
    "crates/ferro-mcp",
    "crates/ferro-ffi",
    "crates/ferro-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/ktsdatpham/ferro"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
