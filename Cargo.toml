[workspace]
resolver = "2"
members = [
    "crates/ferro-core",
    "crates/ferro-io",
    "crates/ferro-snap",
    "crates/ferro-scene",
    "crates/ferro-tools",
    "crates/ferro-revit",
    "crates/ferro-mcp",
    "crates/ferro-cli",
    "crates/ferro-ffi",
    "crates/ferro-app",
    "crates/ferro-kernel",
    "crates/ferro-services",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/ktsdatpham/ferro"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

# solidcore's kernel crate is ~1.1 M lines (ADR 0007): without debug info its dev build
# needs far less memory (rustc peaked at ~5 GB with it on the spike machine).
[profile.dev.package.solidcore]
debug = false
