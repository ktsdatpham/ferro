name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    # Glossary, layers, ferro-core deps, task tree, API map (scripts/lint.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/lint.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      # Toolchain version and components come from rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wasm:
    # D-35: ferro-core must always build for the web.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain version comes from rust-toolchain.toml.
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ferro-core --target wasm32-unknown-unknown

  revit-addin:
    # The C# shell compiles against Revit 2025 reference assemblies (NuGet).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build revit-addin/FerroRevit.csproj -c Release
